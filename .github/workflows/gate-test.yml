name: GATE test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get GitHub token via GATE
        id: gate
        uses: hibare/.github/github/shared-workflows/gate@feat/gate-exchange-action
        env:
         TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
         TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        with:
          gate-server-url: https://gate.int.hibare.in
          target-repository: ${{ github.repository }}
          requested-permissions: '{"contents":"write","pull_requests":"write","issues":"write"}'
          tailscale-enabled: true

      - name: Use token
        env:
          GH_TOKEN: ${{ steps.gate.outputs.token }}
        run: |
          gh api repos/${{ github.repository }}/issues \
            -f title="Test issue from GATE" \
            -f body="Created via GATE token"
